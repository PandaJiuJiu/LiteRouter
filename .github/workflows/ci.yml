name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            backend/target
            .sqlx
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features sqlite

      - name: Prepare database
        run: |
          mkdir -p data
          sqlx database create --database-url sqlite:data/literouter.db
          sqlx migrate run --database-url sqlite:data/literouter.db

      - name: Run cargo fmt
        run: cargo fmt --check --all

      - name: Run cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run cargo test
        run: cargo test --all-targets

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run i18n check
        run: npm run check:i18n

      - name: Run vitest
        run: npm test

      - name: Build production
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t literouter:test .

      - name: Test Docker image runs
        run: |
          docker run --rm -d --name literouter-test \
            -e PORT=3000 \
            -e LITEROUTER_DB=/app/data/literouter.db \
            -v $(pwd)/data:/app/data \
            -p 3000:3000 \
            literouter:test
          sleep 5
          curl -f http://localhost:3000/api/setup-status || exit 1
          docker stop literouter-test