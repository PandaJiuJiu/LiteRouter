name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Matches the Dockerfile's cargo stage, so a dependency that resolves on CI
  # also resolves in the image build.
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        working-directory: backend
        run: cargo build --all-targets

      - name: Unit + integration tests
        working-directory: backend
        # Every integration test opens its own SQLite file under a tempdir, so
        # this needs no database service and no writable checkout.
        run: cargo test --all-targets

      - name: fmt
        working-directory: backend
        # Blocking: the whole tree is rustfmt-clean as of this commit, so a
        # regression here is always someone's new code.
        run: cargo fmt --check

      - name: clippy
        working-directory: backend
        run: cargo clippy --all-targets -- -D warnings

  frontend:
    name: frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Locale key parity
        working-directory: frontend
        # Fails the build when en-US and zh-CN drift apart. vue-i18n falls back
        # silently, so nothing else would catch it.
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
