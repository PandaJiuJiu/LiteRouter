[package]
name = "literouter"
version = "0.1.0"
edition = "2021"

[lib]
name = "literouter"
path = "src/lib.rs"

[[bin]]
name = "literouter"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "migrate"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"

aes-gcm = "0.10"
base64 = "0.22"
futures-util = "0.3"
bytes = "1"
pbkdf2 = "0.12"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 2

[dev-dependencies]
# `test-util` enables tokio::time::pause/advance, used by breaker state-machine
# tests to drive virtual time forward without sleeping.
tokio = { version = "1", features = ["test-util"] }
# `oneshot` lets integration tests drive the router in-process instead of
# binding a port.
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"
tempfile = "3"
serde_json = "1"
