<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" width="360" height="100" role="img" aria-label="LiteRouter">
  <defs>
    <linearGradient id="lrGradBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="lrGradText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Icon: same as logo-icon.svg, scaled and translated into the lockup -->
  <g transform="translate(0,0)">
    <rect width="100" height="100" rx="24" fill="url(#lrGradBox)"/>
    <g fill="#ffffff" stroke="none">
      <circle cx="20" cy="30" r="3.5"/>
      <circle cx="20" cy="50" r="3.5"/>
      <circle cx="20" cy="70" r="3.5"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 23 30 Q 50 30 58 50"/>
      <path d="M 23 50 L 58 50"/>
      <path d="M 23 70 Q 50 70 58 50"/>
      <path d="M 58 50 L 80 50"/>
      <path d="M 73 44 L 80 50 L 73 56"/>
    </g>
    <circle cx="58" cy="50" r="4" fill="#ffffff"/>
  </g>
  <!-- Wordmark: "Lite" neutral, "Router" bold + gradient -->
  <g font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
    <text x="124" y="66" font-size="44" font-weight="500" fill="#475569" letter-spacing="-1">Lite</text>
    <text x="200" y="66" font-size="44" font-weight="700" fill="url(#lrGradText)" letter-spacing="-1">Router</text>
  </g>
</svg>
