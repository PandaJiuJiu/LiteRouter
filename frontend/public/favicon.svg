<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="LiteRouter icon">
  <defs>
    <linearGradient id="lrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Container: rounded square, gradient fill -->
  <rect width="100" height="100" rx="24" fill="url(#lrGrad)"/>
  <!-- Internal routing motif: 3 inputs merge at a central node, one arrow exits right -->
  <g fill="#ffffff" stroke="none">
    <circle cx="20" cy="30" r="3.5"/>
    <circle cx="20" cy="50" r="3.5"/>
    <circle cx="20" cy="70" r="3.5"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 23 30 Q 50 30 58 50"/>
    <path d="M 23 50 L 58 50"/>
    <path d="M 23 70 Q 50 70 58 50"/>
    <path d="M 58 50 L 80 50"/>
    <path d="M 73 44 L 80 50 L 73 56"/>
  </g>
  <!-- Central merge node (subtle, gives the icon an anchor) -->
  <circle cx="58" cy="50" r="4" fill="#ffffff"/>
</svg>
